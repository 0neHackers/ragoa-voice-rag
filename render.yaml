# Render Blueprint — repo root, so "New → Blueprint" needs no manual configuration.
#
# `rootDir` is what makes that true. The Dockerfile lives in the current version folder
# rather than at the repo root (the versioning scheme keeps every phase as a frozen
# snapshot), and without this line Render looks in the wrong place and you have to set the
# root directory by hand in the dashboard.
#
# When the version bumps, this is the one line that has to follow it.
services:
  - type: web
    name: ragoa-voice-rag
    runtime: docker
    rootDir: V9.0
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `standard`, not `starter`. Measured: the ONNX embedding session alone is 536MB and
    # the process settles at ~717MB. Render's `starter` is 512MB — identical to free — so
    # it OOMs just as surely. This file previously said `starter`, which was wrong.
    # If paying isn't an option, see V9.0/LIVE_LINK.md for free alternatives.
    plan: standard
    region: singapore      # closest Render region to India and to Sarvam's endpoints
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The only secret. Drives speech-to-text, generation, translation and TTS.
      # sync:false means Render prompts for it and it never touches git.
      - key: SARVAM_API_KEY
        sync: false
      - key: INDEX_DIR
        value: /app/index_store
      - key: EMBED_THREADS
        value: "1"
      - key: RETRIEVAL_TOP_K
        value: "5"
      - key: STT_TRANSPORT
        value: auto
      - key: PYTHONUNBUFFERED
        value: "1"
